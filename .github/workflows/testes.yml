name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Backend l Script Extração Laudos"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Backend l Script Extração Laudos/requirements.txt"
      - name: Instalar dependências
        run: pip install -r requirements.txt pytest
      - name: Rodar os testes
        run: pytest -v
