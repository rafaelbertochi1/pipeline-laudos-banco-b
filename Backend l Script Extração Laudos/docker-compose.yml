version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres_pdf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer_pdf
    ports:
      - "8080:8080"

volumes:
  pgdata: